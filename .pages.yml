## Pages CMS 설정 — app.pagescms.org 에서 이 저장소를 열면 아래 정의대로 편집 화면이 생깁니다.

media:
  input: assets/img
  output: assets/img

content:
  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    fields:
      - name: projects
        label: 프로젝트 목록 (위가 최신)
        type: object
        list: true
        fields:
          - name: id
            label: 번호 (고유값, 수정하지 않기)
            type: number
          - name: title
            label: 제목
            type: string
            required: true
          - name: category
            label: 표시 분야 (예 "AI & Product · Build", 필터용 태그와 같은 이름 사용)
            type: string
          - name: types
            label: 필터용 태그
            type: select
            options:
              multiple: true
              values: ["AI & Product", "Build", "Research", "Craft & Visual"]
          - name: order
            label: 유형 필터 안 순서 (작을수록 앞, 비우면 최신순)
            type: number
          - name: year
            label: 연도 (예 "2026")
            type: string
          - name: periodLabel
            label: 목록 표시 기간 (예 "2026.07 — 08")
            type: string
          - name: period
            label: 상세 표시 기간 (예 "2026.07 — 2026.08")
            type: string
          - name: org
            label: 소속 · 의뢰처
            type: string
          - name: thumbnail
            label: 썸네일 이미지
            type: image
          - name: summary
            label: 요약 (상세 상단)
            type: text
          - name: overview
            label: Overview
            type: text
          - name: process
            label: Process
            type: text
          - name: outcome
            label: Outcome
            type: text
          - name: graphNote
            label: 시각화 아래 본문 한 문단
            type: text
          - name: role
            label: 역할
            type: string
          - name: team
            label: 팀
            type: string
          - name: tools
            label: 도구
            type: string
          - name: link
            label: 결과물 링크 (URL)
            type: string

  - name: awards
    label: Awards
    type: file
    path: data/awards.json
    fields:
      - name: awards
        label: 수상 내역 (위가 최신)
        type: object
        list: true
        fields:
          - name: id
            label: 번호 (고유값, 수정하지 않기)
            type: number
          - name: award
            label: 수상명 (예 "우수 졸업 작품상")
            type: string
            required: true
          - name: division
            label: 부문 (예 "타이포그라피 부문")
            type: string
          - name: org
            label: 주최 · 소속
            type: string
          - name: work
            label: 수상 작품 · 논문 제목
            type: string
          - name: projectId
            label: 연결할 프로젝트 번호 (Projects의 번호)
            type: number
          - name: kor
            label: 국문 표기 (수상명 · 부문 · 주최)
            type: string
          - name: date
            label: 수상 시점 (예 "2026.08")
            type: string
